# Evolution API (WhatsApp) + Postgres/Redis da Evolution no seu computador.
#
#   cp .env.example .env   # preencha
#   docker compose up -d                       # só a Evolution (Bob na Vercel + ngrok)
#   docker compose --profile local up -d --build   # Evolution + Bob, tudo local
#
# Manager da Evolution: http://localhost:8080/manager
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

  bob:
    profiles: [local]
    build: .
    restart: unless-stopped
    depends_on: [evolution]
    env_file: .env
    environment:
      # Dentro do Docker o Bob fala com a Evolution pelo nome do serviço.
      EVOLUTION_API_URL: http://evolution:8080
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
